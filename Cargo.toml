[package]
name = "leetcode-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = "4.6.6"
dirs = "6.0.0"
reqwest = { version = "0.13.4", features = ["blocking", "json", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
